<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>休暇申請</title>
    <link rel="stylesheet" href="/common.css">
</head>

<body>
    <div class="page">
        <div class="topbar">
            <h1>有給休暇申請</h1><a class="back" href="/main.html">← メイン</a>
        </div>
        <div class="grid">
            <div class="stat"><small>年間 有給休暇</small><strong id="annual">0日</strong></div>
            <div class="stat"><small>使用</small><strong id="used">0日</strong></div>
            <div class="stat"><small>残り 有給休暇</small><strong id="remaining">0日</strong></div>
            <div class="stat"><small>承認 待ち</small><strong id="pendingDays">0日</strong></div>
        </div>
        <div class="card">
            <h2>休暇申請</h2>
            <div class="form-row">
                <div class="field"><label>種類</label><select id="type">
                        <option value="PAID">有給休暇</option>
                        <option value="SICK">病気休暇</option>
                    </select></div>
                <div class="field"><label>開始日</label><input id="start" type="date" required></div>
                <div class="field"><label>終了日</label><input id="end" type="date" required></div>
            </div><br>
            <div class="field"><label>理由</label><textarea id="reason" rows="4" required></textarea></div><br><button
                onclick="submitLeave()">申請する</button>
            <p id="calc" class="muted"></p>
        </div>
        <div class="card">
            <h2>自分の休暇申請 待ち</h2>
            <table>
                <thead>
                    <tr>
                        <th>期間</th>
                        <th>日数</th>
                        <th>種類</th>
                        <th>理由</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </div>
    <script>
        const u = JSON.parse(
            localStorage.getItem('loginUser') || 'null'
        );

        if (!u) {
            location = '/login.html';
        }

        const uid = u?.userId || u?.user_id;

        function days() {
            const s = start.value;
            const e = end.value;

            if (!s || !e) {
                return 0;
            }

            const a = new Date(s);
            const b = new Date(e);

            if (b < a) {
                calc.textContent = '終了日は開始日より前には設定できません。';
                calc.className = 'error';
                return 0;
            }

            const n = Math.round((b - a) / 86400000) + 1;

            calc.textContent = '自動計算: ' + n + '日';
            calc.className = 'muted';

            return n;
        }

        start.addEventListener('change', days);
        end.addEventListener('change', days);

        async function load() {
            const b = await fetch(
                '/api/leave/balance?userId=' + uid
            ).then(r => r.json());

            annual.textContent = b.annual + '日';
            used.textContent = b.used + '日';
            remaining.textContent = b.remaining + '日';
            pendingDays.textContent = b.pending + '日';

            const l = await fetch(
                '/api/leave/my-pending?userId=' + uid
            ).then(r => r.json());

            list.innerHTML = l.length
                ? l.map(x => `
                <tr>
                    <td>${x.startDate} ~ ${x.endDate}</td>
                    <td>${x.daysCount}日</td>
                    <td>${x.leaveType}</td>
                    <td>${x.reason || ''}</td>
                </tr>
            `).join('')
                : `
                <tr>
                    <td colspan="4">
                        承認待ちの申請はありません。
                    </td>
                </tr>
            `;
        }

        async function submitLeave() {
            const d = days();

            if (!d || !reason.value.trim()) {
                return alert('日付と理由を確認してください。');
            }

            const p = new URLSearchParams({
                userId: uid,
                leaveType: type.value,
                startDate: start.value,
                endDate: end.value,
                reason: reason.value
            });

            const r = await fetch(
                '/api/leave/apply?' + p,
                {
                    method: 'POST'
                }
            );

            const txt = await r.text();

            if (!r.ok) {
                return alert(txt || '申請失敗');
            }

            alert('休暇申請が完了しました。');

            reason.value = '';
            load();
        }

        load();
    </script>
</body>

</html>
