<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>部下状況</title>
  <link rel="stylesheet" href="/common.css">
</head>

<body>
  <div class="page">
    <div class="topbar">
      <h1>部下の勤怠・休暇状況</h1><a href="/main.html">← メイン</a>
    </div>
    <div class="card">
      <h2>本日の勤怠</h2>
      <table>
        <thead>
          <tr>
            <th>社員番号</th>
            <th>氏名</th>
            <th>部署</th>
            <th>出勤</th>
            <th>休憩開始</th>
            <th>休憩終了</th>
            <th>退勤</th>
            <th>勤務時間</th>
          </tr>
        </thead>
        <tbody id="attendanceRows"></tbody>
      </table>
    </div>
    <div class="card">
      <h2>休暇状況</h2>
      <table>
        <thead>
          <tr>
            <th>社員番号</th>
            <th>氏名</th>
            <th>種類</th>
            <th>期間</th>
            <th>日数</th>
            <th>理由</th>
            <th>状態</th>
          </tr>
        </thead>
        <tbody id="leaveRows"></tbody>
      </table>
    </div>
  </div>
  <script>
    const user = JSON.parse(
      localStorage.getItem('loginUser') || 'null'
    );

    if (!user || user.role !== 'MANAGER') {
      alert('上司のみアクセスできます。');
      location = '/main.html';
    }

    const uid = user?.userId || user?.user_id;

    const v = x => x ?? '-';

    const leaveType = {
      PAID: '有給休暇',
      SICK: '病気休暇'
    };

    const statusName = {
      PENDING: '承認待ち',
      APPROVED: '承認済み',
      REJECTED: '却下'
    };

    async function load() {
      const a = await fetch(
        '/api/manager/team-attendance?managerId=' + uid
      ).then(r => r.json());

      attendanceRows.innerHTML = a.length
        ? a.map(x => `
                <tr>
                    <td>${x.employee_code}</td>
                    <td>${x.name}</td>
                    <td>${v(x.dept_name)}</td>
                    <td>${v(x.clock_in)}</td>
                    <td>${v(x.break_start)}</td>
                    <td>${v(x.break_end)}</td>
                    <td>${v(x.clock_out)}</td>
                    <td>${x.total_work_hours ?? 0} h</td>
                </tr>
            `).join('')
        : `
                <tr>
                    <td colspan="8">
                        直属部下が登録されていません。
                    </td>
                </tr>
            `;

      const l = await fetch(
        '/api/manager/team-leave?managerId=' + uid
      ).then(r => r.json());

      leaveRows.innerHTML = l.length
        ? l.map(x => `
                <tr>
                    <td>${x.employee_code}</td>
                    <td>${x.name}</td>
                    <td>
                        ${leaveType[x.leave_type] || x.leave_type}
                    </td>
                    <td>
                        ${x.start_date} ～ ${x.end_date}
                    </td>
                    <td>${x.days_count}日</td>
                    <td>${v(x.reason)}</td>
                    <td>
                        ${statusName[x.status] || x.status}
                    </td>
                </tr>
            `).join('')
        : `
                <tr>
                    <td colspan="7">
                        休暇申請はありません。
                    </td>
                </tr>
            `;
    }

    load();
  </script>
</body>

</html>
