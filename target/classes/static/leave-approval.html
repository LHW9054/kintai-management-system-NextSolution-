<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>承認管理</title>
    <link rel="stylesheet" href="/common.css">
</head>

<body>
    <div class="page">
        <div class="topbar">
            <h1>休暇 承認管理</h1>
            <a href="/main.html">← メイン</a>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>社員</th>
                        <th>期間</th>
                        <th>日数</th>
                        <th>理由</th>
                        <th>処理</th>
                    </tr>
                </thead>

                <tbody id="rows"></tbody>
            </table>
        </div>
    </div>

    <script>
        const u = JSON.parse(
            localStorage.getItem('loginUser') || 'null'
        );

        if (!u) {
            location = '/login.html';
        }

        const uid = u?.userId || u?.user_id;

        async function load() {
            const q = u.role === 'MANAGER'
                ? 'managerId=' + uid
                : '';

            const d = await fetch('/api/leave/pending?' + q)
                .then(r => r.json());

            rows.innerHTML = d.length
                ? d.map(x => `
                    <tr>
                        <td>${x.leaveRequestId}</td>
                        <td>${x.userId}</td>
                        <td>${x.startDate} ~ ${x.endDate}</td>
                        <td>${x.daysCount}日</td>
                        <td>${x.reason || ''}</td>
                        <td>
                            <button
                                class="success"
                                onclick="go(${x.leaveRequestId}, 'APPROVED')"
                            >
                                承認
                            </button>

                            <button
                                class="danger"
                                onclick="go(${x.leaveRequestId}, 'REJECTED')"
                            >
                                却下
                            </button>
                        </td>
                    </tr>
                `).join('')
                : `
                    <tr>
                        <td colspan="6">
                            承認 待ち 項目はありません.
                        </td>
                    </tr>
                `;
        }

        async function go(id, status) {
            const r = await fetch(
                `/api/leave/approve?leaveId=${id}&status=${status}&approverId=${uid}`,
                {
                    method: 'POST'
                }
            );

            if (!r.ok) {
                alert('処理に 失敗しました.');
                return;
            }

            load();
        }

        load();
    </script>
</body>

</html>
