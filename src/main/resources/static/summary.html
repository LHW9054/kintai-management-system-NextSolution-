<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>勤務照会</title>
    <link rel="stylesheet" href="/common.css">
</head>

<body>
    <div class="page">
        <div class="topbar">
            <h1>勤務照会</h1><a href="/main.html">← メイン</a>
        </div>
        <div class="card">
            <div class="form-row">
                <div class="field"><label>照会 月</label><input type="month" id="ym"></div><button
                    onclick="load()">照会</button>
            </div>
        </div>
        <div class="grid">
            <div class="stat"><small>総勤務時間</small><strong id="work">0h</strong></div>
            <div class="stat"><small>勤務日数</small><strong id="days">0日</strong></div>
            <div class="stat"><small>残業</small><strong id="ot">0h</strong></div>
            <div class="stat"><small>深夜</small><strong id="night">0h</strong></div>
            <div class="stat"><small>遅刻</small><strong id="late">0回</strong></div>
            <div class="stat"><small>休暇 使用</small><strong id="leave">0日</strong></div>
        </div>
    </div>
    <script>
        const u = JSON.parse(
            localStorage.getItem('loginUser') || 'null'
        );

        if (!u) {
            location = '/login.html';
        }

        const uid = u?.userId || u?.user_id;

        fetch('/api/system/time')
            .then(r => r.json())
            .then(t => {
                const d = new Date(t.now);

                ym.value =
                    `${d.getFullYear()}-` +
                    `${String(d.getMonth() + 1).padStart(2, '0')}`;

                load();
            });

        async function load() {
            const d = await fetch(
                `/api/attendance/monthly-summary?userId=${uid}&yearMonth=${ym.value}`
            ).then(r => r.json());

            work.textContent = d.totalWorkHours + 'h';
            days.textContent = d.workDays + '日';
            ot.textContent = d.totalOvertime + 'h';
            night.textContent = d.totalNightHours + 'h';
            late.textContent = d.lateCount + '回';
            leave.textContent = d.leaveDays + '日';
        }
    </script>
</body>

</html>
